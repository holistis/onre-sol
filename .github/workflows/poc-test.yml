name: PoC Test (independent security research)

on:
  workflow_dispatch:

env:
  SOLANA_VERSION: "stable"
  ANCHOR_VERSION: "0.32.1"

jobs:
  poc:
    name: Run redemption Token-2022 fee-guard PoC
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y build-essential libudev-dev pkg-config libssl-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI (avm)
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}

      - name: Anchor build
        run: anchor build

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node deps
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm install --no-frozen-lockfile

      - name: CJS probe - does litesvm survive plain require()?
        run: node _poc_cjs_probe.cjs

      - name: Run standalone PoC (.cts forces CJS loading)
        run: pnpm exec tsx _poc_standalone.cts
